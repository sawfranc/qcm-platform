services:
  postgres:
    image: postgres:16
    container_name: qcm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: qcm_user
      POSTGRES_PASSWORD: qcm_password
      POSTGRES_DB: qcm_platform
    ports:
      - "5432:5432"
    volumes:
      - qcm_postgres_data:/var/lib/postgresql/data

volumes:
  qcm_postgres_data:
